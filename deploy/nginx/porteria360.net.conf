# Nginx · porteria360.net → Node (Express) en 127.0.0.1:5007 · solo HTTP (sin certificados)
# Instalar:  sudo cp deploy/nginx/porteria360.net.conf /etc/nginx/sites-available/porteria360.net
#            sudo ln -s /etc/nginx/sites-available/porteria360.net /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
# Para agregar HTTPS más adelante:  sudo certbot --nginx -d porteria360.net -d www.porteria360.net
# (certbot edita este archivo: agrega el bloque 443 con el certificado y la redirección HTTP → HTTPS)

# WebSocket (Socket.IO): pasa el "Upgrade" solo cuando el cliente lo pide
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream porteria360_app {
    server 127.0.0.1:5007;
    keepalive 32;
}

# www → dominio principal (una sola URL canónica)
server {
    listen 80;
    listen [::]:80;
    server_name www.porteria360.net;
    return 301 $scheme://porteria360.net$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name porteria360.net;

    # Subidas: video institucional hasta 50 MB (el backend valida cada tipo con su propio límite)
    client_max_body_size 60m;

    # Express ya comprime y define la caché de cada archivo (no duplicar aquí)
    gzip off;

    # Logs propios del sitio
    access_log /var/log/nginx/porteria360.access.log;
    error_log  /var/log/nginx/porteria360.error.log warn;

    # Socket.IO: conexión persistente (tiempo real de guardia, visitas y emergencias)
    location /socket.io/ {
        proxy_pass http://porteria360_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # API y PWA (Express entrega ambas)
    location / {
        proxy_pass http://porteria360_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Express usa "trust proxy 1": toma la IP real del cliente de este encabezado (límites de intentos, auditoría)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OCR del DNI y reportes PDF pueden tardar algunos segundos
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
